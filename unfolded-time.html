<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNFOLDED TIME - Yeh, Min-Xin</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* 全網頁基礎設定 */
      body {
        font-family: "Noto Serif TC", serif;
        font-weight: 300;
        line-height: 1.8;
        margin: 0;
        background-color: #cdcdcd;
        color: #171717;
      }

      /* 導覽列 */
      nav {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 40px 40px 10px;
        box-sizing: border-box;
        text-align: left;
      }
      nav a {
        text-decoration: none;
        color: #3c3c3c;
        font-size: 1rem;
      }

      /* 大卡片容器 */
      .main-container {
        max-width: 1200px;
        margin: 0 auto 40px auto;
        background: #d0d0d0;
        border-radius: 5px;
        overflow: hidden;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
      }

      /* 作品標題區 */
      .content-header {
        padding: 40px;
        border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      }
      .work-detail-title {
        font-size: 2rem;
        margin: 0 0 10px 0;
      }
      .work-detail-title + p {
        margin: 5px 0;
        color: #464646;
      }

      /* 主內容區域 - 三列布局 */
      .work-main-content {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-areas:
          "video video"
          "text image";
        gap: 20px;
        padding: 40px;
        align-items: start;
      }

      /* YT縮圖區 */
      .video-column {
        grid-area: video;
      }

      .video-container {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border-radius: 5px;
      }

      .video-container iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .work-info {
        font-size: 0.8rem;
        color: #464646;
        letter-spacing: 0.5px;
        line-height: 1.6;
        margin-top: 15px;
        margin-bottom: 20px;
      }

      /* 文字說明區 */
      .text-column {
        min-width: 0;
        grid-area: text;
      }

      .article-body {
        font-size: 0.95rem;
        color: #333;
      }

      .article-body h4 {
        font-weight: 500;
        font-size: 1rem;
        margin: 0 0 10px 0;
        border-left: 3px solid #171717;
        padding-left: 12px;
      }

      .article-body p {
        margin: 10px 0;
      }

      /* 主要照片區 */
      .main-image-column {
        display: flex;
        flex-direction: column;
        gap: 20px;
        grid-area: image;
      }

      .main-image {
        width: 100%;
        aspect-ratio: 3 / 2;
        object-fit: cover;
        border-radius: 5px;
      }

      /* 其他照片網格 */
      .gallery-section {
        padding: 40px;
        border-top: 1px solid rgba(0, 0, 0, 0.06);
      }

      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }

      .gallery-item {
        aspect-ratio: 3 / 2;
        overflow: hidden;
        border-radius: 5px;
      }

      .gallery-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* 響應式設計 */
      @media (max-width: 1024px) {
        nav {
          padding: 20px;
        }
        .main-container {
          margin: 0 20px 40px 20px;
        }
        .content-header,
        .work-main-content,
        .gallery-section {
          padding: 20px;
        }
        .work-main-content {
          grid-template-columns: 1fr;
          grid-template-areas:
            "video"
            "image"
            "text";
        }
        .gallery-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="index.html">← HOME</a>
    </nav>

    <div class="main-container">
      <header class="content-header">
        <h1 class="work-detail-title">UNFOLDED TIME</h1>
        <p>時間的剖面</p>
        <p>2025 / Kinetic Installation 動力裝置</p>
      </header>

      <div class="work-main-content">
        <!-- 左列：YT縮圖 + 媒材資訊 -->
        <div class="video-column">
          <div class="video-container">
            <iframe src="https://www.youtube.com/embed/Io9cTdgxCJc" 
              title="YouTube video player" 
              frameborder="0" 
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
              referrerpolicy="strict-origin-when-cross-origin" 
              allowfullscreen>
            </iframe>
          </div>
          <div class="work-info">
            媒材：壓克力、鋁、木材、馬達、燈光裝置、PETG、金屬<br>
            尺寸：500*500*場地高度(單位:mm)
          </div>
        </div>

        <!-- 中列：文字說明 -->
        <div class="text-column">
          <main class="article-body">
            <h4>創作理念</h4>
            <p>
              時間是由多重邏輯、不同尺度的規律所構成的一種複合現象。
            </p>
            <p>
              動力裝置經由馬達運作被賦予生命，生成獨一無二的時間節奏，這些節奏在兩種不同的時間結構中交織，來自材料、機制與環境，各自運行卻彼此干擾重組。
              <br>
              在黑暗中，光線描繪出這些時間的軌跡，如同宇宙中行星的運行軌道，作品希望觀者感受到屬於自己的時間感，體驗時間被具象化、剖開的流動與詩意。
            </p>
          </main>
        </div>

        <!-- 右列：主要照片 -->
        <div class="main-image-column">
          <img src="img/unfoled_time02.jpg" alt="UNFOLDED TIME主圖" class="main-image" />
        </div>
      </div>

      <!-- 其他照片網格 -->
      <div class="gallery-section">
        <h4 style="margin-top: 0; border-left: 3px solid #171717; padding-left: 12px;">PHOTOS
        </h4>
        <div class="gallery-grid">
          <div class="gallery-item">
            <img src="img/unfoled_time01.jpg" alt="作品照片1" />
          </div>
          <div class="gallery-item">
            <img src="img/unfoled_time03.jpg" alt="作品照片2" />
          </div>
          <div class="gallery-item">
            <img src="img/unfoled_time04.jpg" alt="作品照片3" />
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
